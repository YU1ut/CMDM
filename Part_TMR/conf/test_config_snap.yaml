exp_name: exp_snapmogen
checkpoints_dir: ./Part_TMR/checkpoints/${exp_name}/${dataset.dataset_name}

hydra:
  run:
    dir: ./Part_TMR/checkpoints/${exp_name}/${dataset.dataset_name}/test/

defaults:
  - _self_
  - dataset: SnapMoGen

preprocess:
  padding: true

model:
  text_encoder: distilbert-base-uncased

train:
  batch_size: 256
  num_workers: 16

eval:
  eval_train: false
  use_best_model: true
